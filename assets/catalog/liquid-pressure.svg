<svg id="stage" xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="45 40 680 370" role="img" aria-label="Clear liquid tank with a movable membrane probe connected by an air hose to a U-tube manometer"><style>.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
@keyframes iso-flow{}
@keyframes iso-pulse{}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #293e3c;
  background: #f7f8f3;
  font-synthesis: none;
  --paper: #fffefa;
  --ink: #293e3c;
  --muted: #71817b;
  --border: #dfe5db;
  --line: var(--border);
  --grid: var(--border);
  --teal: #397f73;
  --graph: #478d7a;
  --coral: #e58663;
  --stage: #f7f9f4;
  --anatomy-hi: #52776b;
  --anatomy-mid: #60766b;
  --anatomy-lo: #50665d;
  --anatomy-halo: #9eafa5;
  --anatomy-halo-opacity: .12;
  --anatomy-weight: .6px;
  --anatomy-mono: ui-monospace, monospace;
}#stage{cursor:ns-resize;touch-action:none;aspect-ratio:1.84}
#stage text{font-family:inherit;font-size:12px;fill:#42616e;stroke:none}
#stage .engraved{font-size:10px;letter-spacing:1px}
#stage .scale-text{font-size:8px}
#probe,#orientation-part{cursor:grab;touch-action:none}
#orientation-part{cursor:crosshair}
.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.angle-control{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;font-size:12px}
.angle-control label{font-weight:600}.angle-control output{color:var(--teal);margin-left:6px}.angle-control span{font-size:11px;color:var(--muted)}
.angle-control input{margin:10px 0}
.comparison{display:flex;gap:6px;margin-top:14px}.comparison button{flex:1;font-size:11px;padding:7px}
.comparison button[aria-pressed=true]{background:color-mix(in srgb,var(--teal),white 88%);border-color:var(--teal);color:var(--teal)}
#comparison-note{font-size:12px;color:var(--muted);margin:12px 0 0;min-height:18px;line-height:1.5}
.graph-key,.graph-note,.physics-note{font-size:12px;color:var(--muted);line-height:1.6}.graph-key{color:var(--graph)}.graph-note{margin:0}.physics-note{margin:0;padding:0 6px}
input:disabled{opacity:.35;cursor:not-allowed}
@media(min-width:1000px){body:not(.model-fullscreen) #stage{height:clamp(260px,calc(100dvh - 515px),400px)}body:not(.model-fullscreen) .comparison button{font-size:12px;padding:7px 5px}body:not(.model-fullscreen) .controls{padding:12px 20px}body:not(.model-fullscreen) .angle-control input{margin:8px 0}body:not(.model-fullscreen) .control-title output{font-size:23px}body:not(.model-fullscreen) #graph{height:clamp(180px,25dvh,235px)}}
@media(max-width:760px){.control-grid{grid-template-columns:1fr;gap:20px}.angle-control{grid-column:auto;grid-template-columns:1fr}.angle-control input{margin:0}.angle-control span{font-size:12px}.comparison{flex-wrap:wrap}.comparison button{flex:1 1 40%;font-size:11px}.stage-caption [data-readout]{white-space:normal;text-align:right}.control-title output{font-size:23px}.graph-heading{align-items:center}#stage{aspect-ratio:1.7}.physics-note{padding:0 12px 12px}}

:root{background:transparent}#stage{width:100%;height:100%;overflow:hidden;aspect-ratio:auto;background:transparent}*{animation:none!important}</style><defs>
